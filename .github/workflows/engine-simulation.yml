name: QuantumForge Native Simulation Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Configure Linux Build Tools and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Generate Project Build Artifacts
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Execute Live Rollback Simulation Match
        run: |
          cd build
          ./QuantumForgeEngine